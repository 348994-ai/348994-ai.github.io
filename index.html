<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Portal</title>

<style>
body {
  margin: 0;
  background: black;
  color: #00ff88;
  font-family: monospace;
  overflow: hidden;
}

/* 背景代码雨 */
canvas {
  position: fixed;
  top: 0;
  left: 0;
}

/* 首页 */
#home {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.logo {
  font-size: 40px;
  font-weight: bold;
  cursor: pointer;
}

/* 第二页 */
#menu {
  display: none;
  padding-top: 100px;
  text-align: center;
}

.title {
  font-size: 28px;
  margin-bottom: 40px;
  font-weight: bold;
}

.btn {
  display: block;
  margin: 15px auto;
  padding: 12px;
  width: 250px;
  border: 1px solid #00ff88;
  cursor: pointer;
}

.btn:hover {
  background: #00ff88;
  color: black;
}

/* game 页面 */
#games {
  display: none;
  text-align: center;
  padding-top: 60px;
}

.bigW {
  font-size: 120px;
  font-weight: bold;
  margin-bottom: 30px;
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<!-- 首页 -->
<div id="home">
  <div class="logo" onclick="goMenu()">CLICK TO ENTER</div>
</div>

<!-- 菜单 -->
<div id="menu">
  <div class="title">Welcome</div>

  <div class="btn" onclick="openLink('https://discord.com')">Discord</div>
  <div class="btn" onclick="openLink('https://instagram.com')">Instagram</div>
  <div class="btn" onclick="openLink('https://mail.google.com')">Gmail</div>
  <div class="btn" onclick="openLink('https://sites.google.com/stu.wvusd.org/studentportal/home')">Student Portal</div>

  <div class="btn" onclick="goGames()">🎮 Games</div>
</div>

<!-- 游戏页 -->
<div id="games">
  <div class="bigW">W</div>

  <div class="btn" onclick="openLink('https://poki.com')">Poki</div>
  <div class="btn" onclick="openLink('https://random-basketball.github.io/')">Basketball Random</div>
  <div class="btn" onclick="openLink('https://sites.google.com/stu.wvusd.org/tingheilovesqq/home')">tingheilovesqq</div>
  <div class="btn" onclick="openLink('https://soccer-randomx.github.io/')">Soccer Random</div>

  <div class="btn" onclick="back()">⬅ Back</div>
</div>

<script>

/* 页面切换 */
function goMenu() {
  document.getElementById("home").style.display = "none";
  document.getElementById("menu").style.display = "block";
}

function goGames() {
  document.getElementById("menu").style.display = "none";
  document.getElementById("games").style.display = "block";
}

function back() {
  document.getElementById("games").style.display = "none";
  document.getElementById("menu").style.display = "block";
}

function openLink(url) {
  window.open(url, "_blank");
}

/* 黑客代码雨效果 */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

let letters = "01";
letters = letters.split("");

let fontSize = 14;
let columns = canvas.width / fontSize;

let drops = [];
for (let x = 0; x < columns; x++)
  drops[x] = 1;

function draw() {
  ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#00ff88";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    let text = letters[Math.floor(Math.random() * letters.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975)
      drops[i] = 0;

    drops[i]++;
  }
}

setInterval(draw, 33);

</script>

</body>
</html>
