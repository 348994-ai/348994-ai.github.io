<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Portal Pro</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #0a0a0a;
    color: white;
    overflow: hidden;
}

/* ===== LOADING SCREEN ===== */
#loading {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 999;
}

.loader {
    border: 4px solid #222;
    border-top: 4px solid limegreen;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}

/* ===== SIDEBAR ===== */
#sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 80px;
    height: 100%;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 20px;
}

.icon {
    margin: 20px 0;
    font-size: 22px;
    cursor: pointer;
    transition: 0.3s;
}

.icon:hover {
    color: limegreen;
    transform: scale(1.2);
}

/* ===== MAIN ===== */
#main {
    margin-left: 80px;
    height: 100vh;
    padding: 30px;
}

/* HEADER */
header {
    font-size: 28px;
    font-weight: bold;
}

/* W BACKGROUND */
#wbg {
    position: absolute;
    font-size: 400px;
    font-weight: 900;
    color: limegreen;
    opacity: 0.05;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    user-select: none;
}

/* GAME CARDS */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
    margin-top: 30px;
}

.card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 20px;
    border-radius: 15px;
    cursor: pointer;
    transition: 0.3s;
    backdrop-filter: blur(10px);
}

.card:hover {
    transform: translateY(-8px);
    border-color: limegreen;
    box-shadow: 0 0 20px rgba(0,255,0,0.2);
}

/* GAME WINDOW */
#gamePage {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    display: none;
}

#wBig {
    position: absolute;
    font-size: 300px;
    font-weight: 900;
    color: limegreen;
    opacity: 0.15;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

iframe {
    position: absolute;
    width: 90%;
    height: 85%;
    top: 7%;
    left: 5%;
    border: none;
    border-radius: 10px;
}

/* BACK BUTTON */
#back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 10px 15px;
    background: limegreen;
    color: black;
    border: none;
    cursor: pointer;
    font-weight: bold;
    border-radius: 8px;
}
</style>
</head>

<body>

<!-- LOADING -->
<div id="loading">
    <div class="loader"></div>
    <p style="margin-top:20px;">Loading Portal...</p>
</div>

<!-- SIDEBAR -->
<div id="sidebar">
    <div class="icon">🏠</div>
    <div class="icon">🎮</div>
    <div class="icon">⚙️</div>
</div>

<!-- MAIN -->
<div id="main">
    <header>Student Portal Pro</header>

    <div id="wbg">W</div>

    <div class="grid">
        <div class="card" onclick="openGame()">
            🎮 Poki Games
        </div>

        <div class="card">
            🏀 Basketball Random
        </div>

        <div class="card">
            🔥 Trending Games
        </div>

        <div class="card">
            ⭐ Favorites
        </div>
    </div>
</div>

<!-- GAME PAGE -->
<div id="gamePage">
    <div id="wBig">W</div>
    <button id="back" onclick="closeGame()">← Back</button>

    <iframe src="https://poki.com"></iframe>
</div>

<script>
setTimeout(() => {
    document.getElementById("loading").style.display = "none";
}, 1200);

function openGame() {
    document.getElementById("gamePage").style.display = "block";
}

function closeGame() {
    document.getElementById("gamePage").style.display = "none";
}
</script>

</body>
</html>
