<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Portal</title>

<style>
body {
  margin: 0;
  background: black;
  color: #00ff88;
  font-family: monospace;
}

/* 代码雨在最底层 */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

/* 页面内容在上层 */
.container {
  position: relative;
  z-index: 1;
  text-align: center;
}

/* 首页 */
#home {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.logo {
  font-size: 42px;
  font-weight: bold;
  cursor: pointer;
}

/* 菜单 */
#menu, #games {
  display: none;
  padding-top: 80px;
}

.title {
  font-size: 30px;
  margin-bottom: 30px;
  font-weight: bold;
}

.btn {
  display: block;
  margin: 12px auto;
  padding: 12px;
  width: 260px;
  border: 1px solid #00ff88;
  cursor: pointer;
  transition: 0.2s;
}

.btn:hover {
  background: #00ff88;
  color: black;
}

/* Game页 */
.bigW {
  font-size: 120px;
  font-weight: bold;
  margin-bottom: 20px;
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="container">

<!-- 首页 -->
<div id="home">
  <div class="logo" onclick="goMenu()">ENTER</div>
</div>

<!-- 菜单 -->
<div id="menu">
  <div class="title">Welcome</div>

  <div class="btn" onclick="openLink('https://discord.com')">Discord</div>
  <div class="btn" onclick="openLink('https://instagram.com')">Instagram</div>
  <div class="btn" onclick="openLink('https://mail.google.com')">Gmail</div>
  <div class="btn" onclick="openLink('https://sites.google.com/stu.wvusd.org/studentportal/home')">Student Portal</div>

  <div class="btn" onclick="goGames()">🎮 Games</div>
</div>

<!-- 游戏页 -->
<div id="games">
  <div class="bigW">W</div>

  <div class="btn" onclick="openLink('https://poki.com')">Poki</div>
  <div class="btn" onclick="openLink('https://random-basketball.github.io/')">Basketball Random</div>
  <div class="btn" onclick="openLink('https://sites.google.com/stu.wvusd.org/tingheilovesqq/home')">tingheilovesqq</div>
  <div class="btn" onclick="openLink('https://soccer-randomx.github.io/')">Soccer Random</div>

  <div class="btn" onclick="back()">⬅ Back</div>
</div>

</div>

<script>

/* 页面切换 */
function goMenu() {
  document.getElementById("home").style.display = "none";
  document.getElementById("menu").style.display = "block";
}

function goGames() {
  document.getElementById("menu").style.display = "none";
  document.getElementById("games").style.display = "block";
}

function back() {
  document.getElementById("games").style.display = "none";
  document.getElementById("menu").style.display = "block";
}

function openLink(url) {
  window.open(url, "_blank");
}

/* 修复版代码雨 */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let letters = "01";
let fontSize = 14;
let columns;
let drops;

function init() {
  columns = Math.floor(canvas.width / fontSize);
  drops = Array(columns).fill(1);
}
init();

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#00ff88";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    let text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.97) {
      drops[i] = 0;
    }

    drops[i]++;
  }
}

setInterval(draw, 40);

</script>

</body>
</html>
