<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Portal</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0a0f14;
    color: white;
}

/* LOCK SCREEN */
#lock {
    position: fixed;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#lock h1 {
    margin-bottom: 10px;
    letter-spacing: 2px;
}

#lock input {
    padding: 10px;
    border-radius: 8px;
    border: none;
    width: 220px;
    text-align: center;
    font-size: 16px;
}

#lock button {
    margin-top: 10px;
    padding: 8px 14px;
    background: #00ff88;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

#lock button:hover {
    background: #00cc70;
}
</style>
</head>

<body>

<!-- LOCK SCREEN -->
<div id="lock">
    <h1>SECURE ACCESS</h1>
    <input id="pw" type="password" placeholder="Enter Password">
    <button onclick="check()">ENTER</button>
</div>

<script>
function check() {
    let pw = document.getElementById("pw").value;

    if (pw === "111222") {
        // 直接跳转到学生门户
        window.location.href = "https://sites.google.com/stu.wvusd.org/studentportal/home";
    } else {
        alert("Wrong password");
    }
}
</script>

</body>
</html>
