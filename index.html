<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Portal X</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle at top, #111, #000);
    color: white;
    overflow-x: hidden;
}

/* HERO */
.hero {
    padding: 80px 40px;
    text-align: center;
}

.hero h1 {
    font-size: 50px;
    background: linear-gradient(90deg, limegreen, white);
    -webkit-background-clip: text;
    color: transparent;
}

.hero p {
    opacity: 0.7;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 40px;
}

.card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 20px;
    border-radius: 15px;
    cursor: pointer;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
    border-color: limegreen;
    box-shadow: 0 0 20px rgba(0,255,0,0.2);
}

/* GAME PAGE */
#gamePage {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
}

#w {
    position: absolute;
    font-size: 350px;
    color: limegreen;
    opacity: 0.1;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

iframe {
    position: absolute;
    width: 90%;
    height: 85%;
    top: 7%;
    left: 5%;
    border-radius: 12px;
    border: none;
}

.back {
    position: absolute;
    top: 20px;
    left: 20px;
    background: limegreen;
    color: black;
    padding: 10px 15px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="hero">
    <h1>Student Portal X</h1>
    <p>Fast · Clean · Game Hub · Minimal Pro UI</p>
</div>

<div class="grid">
    <div class="card" onclick="openGame()">
        🎮 Play Games
    </div>

    <div class="card" onclick="alert('Stats opened')">
        📊 Stats Dashboard
    </div>

    <div class="card" onclick="alert('Coming soon')">
        ⭐ Favorites
    </div>

    <div class="card" onclick="alert('Settings opened')">
        ⚙️ Settings
    </div>
</div>

<!-- GAME -->
<div id="gamePage">
    <div id="w">W</div>
    <button class="back" onclick="closeGame()">← Back</button>
    <iframe src="https://poki.com"></iframe>
</div>

<script>
function openGame() {
    document.getElementById("gamePage").style.display = "block";
}

function closeGame() {
    document.getElementById("gamePage").style.display = "none";
}
</script>

</body>
</html>
